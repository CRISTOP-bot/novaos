name: NovaOS CI
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build and ELF checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential binutils git qemu-system-x86 xorriso gdb
      - name: Verify dependencies
        run: |
          set -eu
          for tool in gcc ld objcopy objdump readelf qemu-system-x86_64 xorriso gdb git; do
            command -v "$tool" >/dev/null || { echo "NovaOS build dependency missing: $tool"; exit 1; }
            "$tool" --version | head -n 1
          done
      - name: Fetch Limine
        run: make limine LIMINE_VERSION=v8.6.0
      - name: Build kernel and ISO
        run: make kernel image
      - name: Validate ELF
        run: |
          readelf -h build/novaos.elf
          readelf -S build/novaos.elf
          readelf -l build/novaos.elf
          nm build/novaos.elf
          sh scripts/check-elf.sh build/novaos.elf
      - name: Verify debug configuration
        run: make debug-check
      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novaos-build-failure
          if-no-files-found: ignore
          path: |
            build/novaos.elf
            build/novaos.iso
            build/novaos.debug
            build/novaos.sections

  m0:
    name: M0 QEMU and serial
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential binutils git qemu-system-x86 xorriso gdb
      - name: Build image
        run: |
          make limine LIMINE_VERSION=v8.6.0
          make
          make kernel
          make image
      - name: Run M0 smoke test
        run: make test
      - name: Publish M0 summary
        if: success()
        run: |
          {
            echo '## NovaOS CI'; echo 'Build: PASS'; echo 'ELF: PASS'; echo 'ISO: PASS';
            echo 'QEMU: PASS'; echo 'Serial: PASS'; echo 'M0: PASS'; echo 'Result: PASS';
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M0 artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novaos-m0-failure
          if-no-files-found: ignore
          path: |
            build/novaos.elf
            build/novaos.iso
            build/serial.log
            build/novaos.sections

  exception:
    name: Controlled exception
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential binutils git qemu-system-x86 xorriso gdb
      - name: Run controlled exception test
        run: make exception-test LIMINE_VERSION=v8.6.0
      - name: Upload exception artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: novaos-exception-failure
          if-no-files-found: ignore
          path: |
            build-exception/novaos.elf
            build-exception/novaos.iso
            build-exception/serial.log
